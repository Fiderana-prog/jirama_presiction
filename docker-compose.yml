services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jirama-backend
    restart: unless-stopped
    environment:
      API_ROOT_PATH: /api
    expose:
      - "8000"
    networks:
      - jirama-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PREDICTION_API_URL: /api
    container_name: jirama-frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jirama-net

  nginx:
    image: nginx:1.27-alpine
    container_name: jirama-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/docker-health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jirama-net

networks:
  jirama-net:
    driver: bridge
