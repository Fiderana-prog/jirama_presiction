upstream jirama_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream jirama_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # FastAPI est exposée sous /api au navigateur.
    # Le slash final de proxy_pass retire le préfixe /api avant FastAPI.
    location /api/ {
        proxy_pass http://jirama_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://jirama_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location = /docker-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\\n";
    }
}
